<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sua Ótica</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg,#000814,#001d3d,#000814);
      color:#fff;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:420px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:28px;
      padding:32px 24px;
      text-align:center;
      box-shadow:0 10px 40px rgba(0,0,0,0.6);
    }

    .logo{
      width:140px;
      height:140px;
      margin:0 auto 16px;
      border-radius:50%;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      border:3px solid #00b4ff;
      box-shadow:0 0 25px rgba(0,180,255,.45);
    }

    .logo img{
      width:100%;
      height:100%;
      object-fit:contain;
      background:#000;
      padding:10px;
    }

    h1{
      font-size:2rem;
      color:#ffd166;
      margin-bottom:8px;
    }

    .subtitle{
      color:#d6e6ff;
      font-size:0.95rem;
      margin-bottom:28px;
    }

    .btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      width:100%;
      padding:16px 18px;
      border-radius:16px;
      text-decoration:none;
      font-weight:700;
      font-size:1rem;
      margin-bottom:16px;
      transition:transform .2s ease, box-shadow .2s ease;
    }

    .btn:hover{
      transform:translateY(-2px);
    }

    .whatsapp{
      background:#25D366;
      color:#fff;
      box-shadow:0 8px 22px rgba(37,211,102,.35);
    }

    .maps{
      background:#0d6efd;
      color:#fff;
      box-shadow:0 8px 22px rgba(13,110,253,.35);
    }

    .divider{
      width:70px;
      height:3px;
      background:#ffd166;
      margin:18px auto 22px;
      border-radius:999px;
    }

    .location{
      margin-top:10px;
      color:#d6e6ff;
      font-size:0.95rem;
      line-height:1.5;
    }

    .footer{
      margin-top:22px;
      color:#b7c9e6;
      font-size:0.82rem;
    }

    @media (max-width:480px){
      .container{
        padding:28px 18px;
      }

      h1{
        font-size:1.8rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- LOGO -->
    <div class="logo">
      <img src="/imagens.jpg" alt="Sua Ótica">
    </div>

    <h1>Sua Ótica</h1>
    <p class="subtitle">
      Cuidando da sua visão com qualidade, estilo e o melhor atendimento.
    </p>

    <div class="divider"></div>

    <!-- WHATSAPP -->
    <a class="btn whatsapp"
       href="https://wa.me/5598985479687"
       target="_blank">
      💬 Falar no WhatsApp
    </a>

    <!-- LOCALIZAÇÃO -->
    <a class="btn maps"
       href="https://maps.app.goo.gl/GWQSHPLvzcoQBJtd7"
       target="_blank">
      📍 Ver localização
    </a>

    <div class="location">
      Avenida Paulino Neves – Centro, Tutóia/MA
    </div>

    <div class="footer">
      © 2026 Sua Ótica • Todos os direitos reservados
    </div>

  </div>
</body>
</html>
